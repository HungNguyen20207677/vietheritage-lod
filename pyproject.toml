[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietheritage-lod"
version = "0.0.0"
description = "Linked Open Data knowledge graph for Vietnamese cultural heritage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "rdflib",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
